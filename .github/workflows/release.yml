name: Release

# Push a tag named after the packages' shared version (v0.2.0) to publish
# @exwave-nexus/auth and @exwave-nexus/auth-mock to GitHub Packages, with the
# workflow's own token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: exwave-root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@exwave-nexus"
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the versions
        run: bun scripts/check-versions.ts "$GITHUB_REF_NAME"
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build, stage and smoke-test
        # Smoke stages too: it installs the tarballs the next step publishes.
        run: bun run smoke
      - name: Publish
        # Published versions can't be overwritten: skip one that is already
        # there, so a rerun after a partial failure finishes the rest.
        run: |
          for dir in packages/auth packages/auth-mock; do
            name=$(jq -r .name "$dir/publish/package.json")
            version=$(jq -r .version "$dir/publish/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$dir/publish"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
