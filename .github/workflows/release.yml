name: Release

# Push a tag named after the packages' shared version (v0.3.0) once the
# packages are on npm: they are published by hand (AGENTS.md, Releases). This
# checks the tag, runs the checks and the smoke test, then publishes any
# version npm doesn't have yet with the NPM_TOKEN secret. That last step fails
# for now, because npm restricts tokens that bypass 2FA; trusted publishing
# from these hosted runners would replace the token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Hosted: the repository is public, so the exwave-root runners never take
    # its jobs, and npm's trusted publishing only works from hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the npm token is set
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret that can publish the packages"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the versions
        run: bun scripts/check-versions.ts "$GITHUB_REF_NAME"
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build, stage and smoke-test
        # Smoke stages too: it installs the tarballs the next step publishes.
        run: bun run smoke
      - name: Publish
        # Published versions can't be overwritten: skip one that is already
        # there, so a rerun after a partial failure finishes the rest. The
        # scope's registry is set explicitly so a scope mapping in some npm
        # config can't send @exwave-nexus/* elsewhere.
        run: |
          npmjs="--registry=https://registry.npmjs.org/ --@exwave-nexus:registry=https://registry.npmjs.org/"
          # Dependencies first: each package can install the ones before it.
          for dir in packages/auth packages/auth-react packages/auth-nextjs packages/auth-mock packages/create; do
            name=$(jq -r .name "$dir/publish/package.json")
            version=$(jq -r .version "$dir/publish/package.json")
            if npm view "$name@$version" version $npmjs >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$dir/publish" --access public $npmjs
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
