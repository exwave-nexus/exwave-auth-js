name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: exwave-root
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
        env:
          # The mock's key, so production builds bundle the whole app.
          VITE_EXWAVE_PUBLISHABLE_KEY: exw_pk_MXxodHRwOi8vbG9jYWxob3N0OjQwMTB8NmYxYzJhMTAtNWEzZS00YzJiLTlkNGUtMGExYjJjM2Q0ZTVm
      - name: Core bundle size
        run: bun run size
