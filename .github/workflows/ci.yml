name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: exwave-root
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Versions
        run: bun run check-versions
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build (packages and templates)
        # The templates' .env.development holds the mock's key.
        run: bun run build
      - name: Templates and registry
        # The templates' copies match packages/create/shared, and the built
        # registry/public/r is up to date.
        run: |
          bun run templates:check
          bun run registry:build
          git diff --exit-code -- registry/public
      - name: Core bundle size
        run: bun run size
      - name: Stage the packages
        run: for dir in packages/auth packages/auth-react packages/auth-nextjs packages/auth-mock packages/create; do bun scripts/stage.ts $dir; done

  smoke:
    # Slow and networked: on main only. Installs the staged tarballs into new
    # apps and a fresh shadcn app, builds them, and signs in against the mock.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Smoke test
        run: bun run smoke
