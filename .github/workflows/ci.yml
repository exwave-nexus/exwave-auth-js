name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: exwave-root
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Versions
        run: bun run check-versions
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build (packages and templates)
        # The templates' .env.development holds the mock's key.
        run: bun run build
      - name: Registry
        # The templates' components match registry/exwave, and the built
        # registry/public/r is up to date.
        run: |
          bun run registry:check
          bun run registry:build
          git diff --exit-code -- registry/public
      - name: Core bundle size
        run: bun run size
      - name: Stage the packages
        run: bun scripts/stage.ts packages/auth && bun scripts/stage.ts packages/auth-mock
